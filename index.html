<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<meta name="description" content="Пойдёшь со мной на свидание? 💌">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Пойдёшь со мной на свидание? 🐻💕</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Переиспользуемые иллюстрации -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bear-face" viewBox="0 0 240 220">
      <circle cx="70" cy="55" r="27" fill="#c98a5e"/>
      <circle cx="170" cy="55" r="27" fill="#c98a5e"/>
      <circle cx="70" cy="55" r="13" fill="#a8703f"/>
      <circle cx="170" cy="55" r="13" fill="#a8703f"/>
      <circle cx="120" cy="112" r="78" fill="#dba374"/>
      <ellipse cx="120" cy="132" rx="36" ry="27" fill="#f6e3cb"/>
      <ellipse cx="76" cy="127" rx="13" ry="9" fill="#ffb6c1" opacity="0.75"/>
      <ellipse cx="164" cy="127" rx="13" ry="9" fill="#ffb6c1" opacity="0.75"/>
      <path d="M88 102 Q98 94 108 102" stroke="#4a3226" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M132 102 Q142 94 152 102" stroke="#4a3226" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="120" cy="126" rx="9" ry="7" fill="#4a3226"/>
    </symbol>
    <symbol id="cat" viewBox="0 0 240 240">
      <path d="M55 70 L35 15 L95 55 Z" fill="#e8a355"/>
      <path d="M185 70 L205 15 L145 55 Z" fill="#e8a355"/>
      <path d="M60 65 L48 30 L85 55 Z" fill="#ffb6c1" opacity="0.8"/>
      <path d="M180 65 L192 30 L155 55 Z" fill="#ffb6c1" opacity="0.8"/>
      <circle cx="120" cy="120" r="80" fill="#f0b878"/>
      <ellipse cx="75" cy="135" rx="16" ry="10" fill="#ffb6c1" opacity="0.6"/>
      <ellipse cx="165" cy="135" rx="16" ry="10" fill="#ffb6c1" opacity="0.6"/>
      <path d="M85 108 Q98 96 111 108" stroke="#4a3226" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="150" cy="106" r="7" fill="#4a3226"/>
      <circle cx="152" cy="103" r="2.4" fill="#fff"/>
      <path d="M138 88 Q150 80 165 86" stroke="#4a3226" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M113 132 L127 132 L120 140 Z" fill="#e8607f"/>
      <path d="M120 140 Q135 155 150 142" stroke="#4a3226" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M120 140 Q108 150 95 142" stroke="#4a3226" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <line x1="30" y1="118" x2="75" y2="122" stroke="#4a3226" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="132" x2="74" y2="132" stroke="#4a3226" stroke-width="3" stroke-linecap="round"/>
      <line x1="210" y1="118" x2="165" y2="122" stroke="#4a3226" stroke-width="3" stroke-linecap="round"/>
      <line x1="212" y1="132" x2="166" y2="132" stroke="#4a3226" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="bg-decor" aria-hidden="true">
  <span class="blob blob--1"></span>
  <span class="blob blob--2"></span>
  <span class="blob blob--3"></span>
</div>
<div id="hearts-field" class="hearts-field" aria-hidden="true"></div>
<div id="space-field" class="space-field" aria-hidden="true"></div>
<div id="confetti-field" class="confetti-field" aria-hidden="true"></div>

<main class="app">

  <!-- Экран 1: игра Да / Нет -->
  <section class="screen is-active" id="screen-question">
    <div class="space-content">
      <div class="cat-wrap">
        <svg class="cat-svg"><use href="#cat"/></svg>
      </div>

      <div class="buttons-field" id="buttons-field">
        <button class="btn-yes" id="btn-yes" type="button" aria-label="Да">
          <svg viewBox="0 0 32 29" class="heart-icon" aria-hidden="true">
            <path d="M16 29C16 29 0 19.5 0 9.5C0 4.25 4 0 9 0C12 0 14.5 1.5 16 4C17.5 1.5 20 0 23 0C28 0 32 4.25 32 9.5C32 19.5 16 29 16 29Z"/>
          </svg>
          <span>Да</span>
        </button>
        <button class="btn-no" id="btn-no" type="button">Нет</button>
      </div>

      <p class="caption" id="dodge-caption">&nbsp;</p>
    </div>
  </section>

  <!-- Экран 2: приглашение -->
  <section class="screen" id="screen-yes">
    <div class="card">
      <div class="kiss-scene">
        <svg class="kiss-bear kiss-bear--girl"><use href="#bear-face"/></svg>
        <svg class="kiss-bear kiss-bear--boy"><use href="#bear-face"/></svg>
        <span class="kiss-heart" aria-hidden="true">💗</span>
      </div>
      <p class="text text--message">
        Ты мой сладкий пирожочек 💋<br>
        Прости меня и я тебя прощаю 🌝<br>
        Я приглашаю тебя на свидание.<br>
        Если не согласишься, то ночью к тебе зайду и отрежу твой писюн )) 🤭
      </p>
      <button class="btn btn--ghost" id="btn-replay" type="button">Начать заново</button>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
